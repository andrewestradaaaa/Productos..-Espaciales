<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/jpeg" href="logo.png.jpeg">

<title>Productos Espaciales | Soluciones de limpieza</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --azul: #2563A6;
    --azul-claro: #E7F0FA;
    --azul-suave: #BBD4EF;
    --oscuro: #17283B;
    --fondo: #F7F9FC;
    --gris: #687586;
    --blanco: #FFFFFF;
}

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--fondo);
    color: var(--oscuro);
    overflow-x: hidden;
}

/* BARRA SUPERIOR */

.topbar {
    background: var(--oscuro);
    color: var(--blanco);
    padding: 12px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    font-size: 11px;
    letter-spacing: 1.5px;
}

/* ENCABEZADO */

header {
    background: var(--blanco);
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
    border-bottom: 1px solid #E0E7EF;
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
}

.brand img {
    width: 58px;
    height: 58px;
    object-fit: contain;
}

.brand h1 {
    font-family: Georgia, serif;
    font-size: 25px;
    font-weight: normal;
}

.brand p {
    color: var(--azul);
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 5px;
    text-transform: uppercase;
}

/* MENÚ */

nav {
    display: flex;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
}

nav button {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 0;
    color: var(--oscuro);
    font-size: 13px;
    cursor: pointer;
    transition: 0.25s;
}

nav button:hover,
nav button.activo {
    color: var(--azul);
    border-bottom-color: var(--azul);
}

/* CONTENIDO NORMAL */

.contenedor-paginas {
    width: 100%;
    margin: 0;
    padding: 0;
}

#contenido {
    display: block;
    width: 100%;
    height: 750px;
    border: none;
    background: var(--blanco);
}

/* PIE DE PÁGINA */

footer {
    background: var(--oscuro);
    color: #D5E0EC;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    font-size: 11px;
}

footer strong {
    color: var(--azul-suave);
}

/* BOTÓN PARA VOLVER AL MENÚ */

#volverMenu {
    display: none;
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10000;
    background: var(--azul-oscuro, #17283B);
    color: white;
    border: 1px solid #BBD4EF;
    border-radius: 7px;
    padding: 11px 16px;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 3px 12px #0003;
}

#volverMenu:hover {
    background: var(--azul);
}

/* MODO PANTALLA COMPLETA */

body.modo-pantalla {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
}

body.modo-pantalla .topbar,
body.modo-pantalla header,
body.modo-pantalla footer {
    display: none;
}

body.modo-pantalla .contenedor-paginas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body.modo-pantalla #contenido {
    width: 100%;
    height: 100%;
    min-height: 0;
    margin: 0;
    padding: 0;
    border: none;
}

body.modo-pantalla #volverMenu {
    display: block;
}

/* CELULARES */

@media (max-width: 800px) {
    header {
        flex-direction: column;
        align-items: flex-start;
    }

    nav {
        gap: 20px;
    }
}

@media (max-width: 520px) {
    .topbar {
        padding: 12px 5%;
        font-size: 9px;
        letter-spacing: 0.5px;
    }

    header {
        padding: 20px 5%;
    }

    .brand img {
        width: 48px;
        height: 48px;
    }

    .brand h1 {
        font-size: 21px;
    }

    nav {
        gap: 8px 18px;
    }

    nav button {
        font-size: 12px;
    }

    footer {
        padding: 20px 5%;
    }

    #volverMenu {
        top: 8px;
        right: 8px;
        padding: 9px 12px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<!-- BARRA SUPERIOR -->

<div class="topbar">
    <span>PRODUCTOS ESPACIALES</span>
    <span>CALIDAD · CONFIANZA · COMPROMISO</span>
</div>

<!-- ENCABEZADO Y MENÚ -->

<header>
    <div class="brand">
        <img src="logo.png.jpeg" alt="Logo de Productos Espaciales">

        <div>
            <h1>Productos Espaciales</h1>
            <p>Soluciones de limpieza</p>
        </div>
    </div>

    <nav>
        <button onclick="cargarPagina('inicio.html', this)">
            Nosotros
        </button>

        <button onclick="cargarPagina('informacion.html', this)">
            Información
        </button>

        <button onclick="cargarPagina('productos.html', this)">
            Productos
        </button>

        <button onclick="cargarPagina('valores.html', this)">
            Valores
        </button>

    </nav>
</header>

<!-- CONTENIDO DE LAS PÁGINAS -->

<div class="contenedor-paginas">
    <iframe
        id="contenido"
        src="inicio.html"
        title="Contenido de Productos Espaciales">
    </iframe>
</div>

<!-- PIE DE PÁGINA -->

<footer>
    <span>© 2026 <strong>Productos Espaciales</strong></span>
    <span>Soluciones de limpieza · Calidad · Confianza</span>
</footer>

<!-- BOTÓN PARA REGRESAR -->

<button id="volverMenu" onclick="volverAlMenu()">
    ← Volver al menú
</button>

<script>
const iframe = document.getElementById("contenido");

function cargarPagina(archivo, boton) {
    iframe.src = archivo;

    document.body.classList.add("modo-pantalla");

    document.querySelectorAll("nav button").forEach(function(elemento) {
        elemento.classList.remove("activo");
    });

    boton.classList.add("activo");
}

function volverAlMenu() {
    document.body.classList.remove("modo-pantalla");
}
</script>

</body>
</html>
